<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شبیه‌ساز کیس‌های اورژانس</title>
<style>
:root{color-scheme:light;--bg:#f7f3f1;--card:#ffffff;--ink:#17202b;--mut:#5d6877;--line:#e2d9d6;--brand:#0c6a73;--brandink:#ffffff;--ok:#17703f;--okbg:#e4f4ea;--warn:#8f5200;--warnbg:#fff1d9;--bad:#a8231c;--badbg:#fdeae8;--neu:#46505e;--neubg:#eef0f3;--paper:#fdf5f3;--g1:#f5dad5;--g2:#ecbab2;--mon:#0b141b}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0e151c;--card:#16202a;--ink:#e7edf3;--mut:#9aa8b6;--line:#2a3541;--brand:#4cc0c9;--brandink:#06161a;--ok:#62d595;--okbg:#12301f;--warn:#f1b765;--warnbg:#382a0e;--bad:#ff8c82;--badbg:#3c1a17;--neu:#b6c1cd;--neubg:#212b36;--paper:#0f1a23;--g1:#142431;--g2:#1c3547;--mon:#070d12}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn","IRANSans","Segoe UI",Tahoma,system-ui,sans-serif;font-size:16px;line-height:1.95}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
.grid{background-color:var(--paper);background-image:linear-gradient(var(--g2) 1px,transparent 1px),linear-gradient(90deg,var(--g2) 1px,transparent 1px),linear-gradient(var(--g1) 1px,transparent 1px),linear-gradient(90deg,var(--g1) 1px,transparent 1px);background-size:50px 50px,50px 50px,10px 10px,10px 10px}
.hero{padding:30px 0 24px;border-bottom:1px solid var(--line)}
.hero h1{margin:0 0 8px;font-size:1.65rem;line-height:1.5}
.hero p{margin:0 0 6px;color:var(--mut);max-width:60ch}
.rules{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:.93rem}
.rules li{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;line-height:1.8}
.rules i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:9px}
.topic{margin:26px 0 8px;font-size:1.1rem}
.cards{display:grid;gap:10px}
.cc{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;min-height:64px}
.cc:hover{border-color:var(--brand)}
.cc b{display:block;font-size:1.02rem}
.cc span{color:var(--mut);font-size:.92rem}
.tag{display:inline-block;margin-top:6px;padding:0 10px;border-radius:99px;font-size:.82rem;line-height:1.8}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:8px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:2px 12px;cursor:pointer;white-space:nowrap}
.ttl{flex:1;font-weight:700;font-size:.95rem;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hearts{display:flex;gap:5px;align-items:center}
.hearts i{width:13px;height:13px;border-radius:50%;background:var(--line)}
.hearts i.on{background:var(--bad)}
.pt{margin:14px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.pt small{color:var(--mut)}
.mon{display:flex;flex-wrap:wrap;gap:8px;background:var(--mon);border-radius:12px;padding:12px;margin:12px 0}
.chip{flex:1 1 76px;min-width:76px;text-align:center;border:1px solid #1f2d38;border-radius:8px;padding:2px 6px}
.chip small{display:block;color:#8aa0b2;font-size:.74rem;line-height:1.5}
.chip b{display:block;font-size:1.2rem;line-height:1.5;font-variant-numeric:tabular-nums}
.c-HR b{color:#5ff0a5}.c-BP b{color:#ff8a80}.c-RR b{color:#ffd166}.c-SpO2 b{color:#59d0ff}.c-T b{color:#e6e6e6}.chip b{color:#d5dce3}
.clock{margin:6px 0 4px;font-size:.9rem;color:var(--mut);display:flex;justify-content:space-between}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--brand);transition:width .4s}
.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.stg{margin:18px 0 4px;font-size:1.15rem;line-height:1.6}
.narr{margin:0 0 10px}
.q{font-weight:700;margin:12px 0 8px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:52px;cursor:pointer;line-height:1.8}
.opt input{flex:none;width:22px;height:22px;margin:5px 0 0;accent-color:var(--brand)}
.opt span{flex:1}
.opt em{flex:none;font-style:normal;font-size:.8rem;padding:0 8px;border-radius:99px;line-height:1.8;margin-top:3px}
.opt.lk{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok em{color:var(--ok)}
.opt.neu{background:var(--neubg)}.opt.neu em{color:var(--neu)}
.opt.warn{border-color:var(--warn);background:var(--warnbg)}.opt.warn em{color:var(--warn)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad em{color:var(--bad)}
.act{margin:16px 0 8px;display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--brand);color:var(--brandink);border:0;border-radius:10px;padding:10px 22px;font-weight:700;cursor:pointer;min-height:48px}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line);font-weight:400}
.note{margin:12px 0;padding:10px 14px;border-radius:10px;background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}
.sec{margin:20px 0 8px;font-size:1rem;color:var(--mut)}
.res{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--brand);border-radius:10px;padding:8px 14px;margin:8px 0}
.res .rt{font-weight:700;font-size:.92rem;color:var(--mut);line-height:1.7}
.res.ok{border-inline-start-color:var(--ok)}.res.neu{border-inline-start-color:var(--neu)}.res.warn{border-inline-start-color:var(--warn)}.res.bad{border-inline-start-color:var(--bad)}
details{margin:10px 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 14px}
summary{cursor:pointer;padding:6px 0;font-weight:700}
.end{margin:18px 0;padding:18px 18px 8px;border-radius:14px;border:2px solid}
.end h2{margin:0 0 6px;font-size:1.4rem;line-height:1.5}
.end.bad{background:var(--badbg);border-color:var(--bad)}.end.bad h2{color:var(--bad)}
.end.ok{background:var(--okbg);border-color:var(--ok)}.end.ok h2{color:var(--ok)}
.score{font-size:2.2rem;font-weight:800;line-height:1.4;font-variant-numeric:tabular-nums}
.deb{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:10px 0}
.deb h4{margin:4px 0}
.deb ul{list-style:none;margin:0;padding:0}
.deb li{display:flex;gap:10px;padding:2px 0}
.deb li span{flex:none;width:18px;text-align:center;font-weight:700}
.deb li.ok span{color:var(--ok)}.deb li.miss span{color:var(--bad)}.deb li.warn span{color:var(--warn)}
.deb p{margin:6px 0;color:var(--mut);font-size:.93rem}
.pearls{margin:8px 0 14px;padding-inline-start:20px}
.pearls li{margin:3px 0}
#toast{position:fixed;inset-inline:0;bottom:18px;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
#toast.on{opacity:1}
.foot{height:70px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
const CASES=[];
CASES.push({
id:"acs1",topic:"سندرم حاد کرونری (ACS)",title:"STEMI تحتانی با افت فشار",brief:"مرد ۵۸ ساله، درد قفسه‌سینه ۶۰ دقیقه‌ای و فشار پایین",
intro:"مرد ۵۸ ساله، دیابتی و سیگاری، با درد فشارنده پشت جناغ از ۶۰ دقیقه پیش همراه تعریق سرد، تهوع و سرگیجه با آمبولانس وارد اورژانس شده است.",
stages:[
{h:"ارزیابی و اقدامات اولیه",v:"HR 52|BP 86/54|RR 18|SpO2 96%|T 36.7",narr:"بیمار رنگ‌پریده و عرق‌کرده است و هنوز درد دارد.",q:"اقدامات اولیه را انتخاب کن.",
o:[
{t:"ECG ۱۲ لیدی فوری (هدف: ≤۱۰ دقیقه از ورود)",k:"e",r:"ST بالارفته در II، III و aVF با افت متقابل ST در I و aVL: STEMI تحتانی."},
{t:"مانیتور قلبی، پالس‌اکسیمتری، رگ‌گیری IV و اتصال پدهای دفیبریلاتور",k:"e",r:"ریتم سینوسی با ضربان ۵۲. دسترسی وریدی برقرار و پدها متصل شد."},
{t:"آسپرین ۱۶۲ تا ۳۲۵ میلی‌گرم جویدنی",k:"e",r:"آلرژی ندارد؛ آسپرین ۳۲۵ mg جویده شد."},
{t:"شرح حال و معاینه متمرکز (JVP، سمع ریه، نبض‌ها)",k:"e",r:"JVP بالا، ریه‌ها پاک، نبض‌ها قرینه. افت فشار + JVP بالا + ریه پاک: یعنی درگیری بطن راست مطرح است."},
{t:"اکسیژن با ماسک ریزرووار برای همه بیماران درد قفسه‌سینه",k:"w",m:5,r:"SpO₂ برابر ۹۶٪ است؛ اکسیژن در بیمار غیرهیپوکسیک فایده ندارد و ممکن است زیان‌بار باشد."},
{t:"منتظر ماندن برای نتیجه تروپونین پیش از هر تصمیم",k:"w",m:30,r:"ECG تشخیصی است. ۳۰ دقیقه گذشت و هیچ اقدامی برای بازگشایی عروق انجام نشد."},
{t:"عکس قفسه‌سینه پرتابل بدون تأخیر در بقیه اقدامات",k:"n",r:"اندازه قلب طبیعی، ریه‌ها بدون ادم."},
{t:"نمونه خون: تروپونین، CBC، الکترولیت‌ها، کراتینین",k:"n",r:"نمونه‌ها ارسال شد؛ نتیجه بعداً می‌رسد."},
{t:"انتقال فوری به رادیولوژی برای CT آنژیوگرافی کرونر",k:"f",r:"بیمار با فشار پایین و بدون مانیتور کافی به CT رفت؛ در اتاق اسکن دچار VF شد و احیا موفق نبود."}
],
why:"در STEMI تشخیص با ECG است؛ زمان یعنی عضله. ECG تا ۱۰ دقیقه، آسپرین، مانیتور و دفیبریلاتور الزامی است. منتظر تروپونین یا تصویربرداری نمی‌مانیم و بیمار ناپایدار را بی‌مانیتور جابه‌جا نمی‌کنیم."},
{h:"STEMI تحتانی با درگیری بطن راست",v:"HR 50|BP 84/52|RR 20|SpO2 95%|T 36.7",narr:"ECG: STEMI تحتانی. بیمار هنوز درد دارد، فشار پایین است، JVP بالا و ریه‌ها پاک‌اند.",q:"اقدام‌های بعدی چیست؟",
o:[
{t:"ECG لیدهای راست‌سمت (V4R)",k:"e",r:"ST بالارفته در V4R (≥۱ mm): انفارکت بطن راست تأیید شد."},
{t:"فعال‌سازی کت‌لب برای آنژیوپلاستی اولیه (هدف: تماس اول تا بالون ≤۹۰ دقیقه)",k:"e",r:"کت‌لب فعال شد و تیم تا ۳۰ دقیقه آماده است."},
{t:"بولوس ۲۵۰ تا ۵۰۰ میلی‌لیتر نرمال‌سالین (حساسیت به پیش‌بار)",k:"e",r:"فشار بعد از ۵۰۰ mL به ۹۴/۵۸ رسید؛ ریه‌ها هنوز پاک است."},
{t:"هپارین ناشکسته و مهارکننده P2Y12 طبق پروتکل مرکز",k:"e",r:"UFH تزریق شد و تیکاگرلور ۱۸۰ mg با هماهنگی کاردیولوژی داده شد."},
{t:"نیتروگلیسیرین زیرزبانی یا IV برای درد",k:"f",r:"در انفارکت بطن راست بیمار وابسته به پیش‌بار است؛ نیترات فشار را شدید پایین آورد و بیمار دچار ایست شد."},
{t:"متوپرولول IV برای کاهش ضربان و ایسکمی",k:"f",r:"بتابلاکر در بیمار با فشار پایین، برادی‌کاردی و درگیری RV باعث شوک کاردیوژنیک و بلوک کامل شد؛ بیمار از دست رفت."},
{t:"فوروزماید IV برای کاهش فشار پرشدگی",k:"w",m:12,r:"دیورز پیش‌بار را کم کرد؛ فشار به ۷۰/۴۰ رسید و نیاز به اقدام نجات‌دهنده شد."},
{t:"مرفین ۴ mg IV برای درد",k:"w",m:8,r:"مرفین پیش‌بار را کم می‌کند و جذب داروی ضدپلاکت را به تأخیر می‌اندازد؛ فشار پایین‌تر شد."},
{t:"تجویز فیبرینولیتیک به‌جای PCI",k:"w",m:15,r:"کت‌لب در دسترس است و PCI ارجح است؛ ترومبولیز غیرضروری بود و خطر خونریزی افزود."}
],
why:"در STEMI تحتانی همیشه V4R بگیر. در درگیری بطن راست نیترات، مرفین، دیورتیک و بتابلاکر ممنوع یا خطرناک‌اند؛ پیش‌بار با مایع حفظ می‌شود و درمان قطعی PCI اولیه است."},
{h:"برادی‌کاردی و بلوک AV",v:"HR 36|BP 72/40|RR 22|SpO2 93%",narr:"هنگام آماده‌سازی انتقال به کت‌لب بیمار گیج می‌شود. ECG: بلوک کامل AV با ضربان بطنی ۳۶ و کمپلکس باریک.",q:"چه می‌کنی؟",
o:[
{t:"آتروپین ۱ mg IV (قابل تکرار هر ۳ تا ۵ دقیقه تا ۳ mg)",k:"e",r:"ضربان به ۵۴ و فشار به ۸۸/۵۲ رسید. بلوک ناحیه گره AV در MI تحتانی اغلب به آتروپین پاسخ می‌دهد."},
{t:"آماده‌سازی پیس ترانس‌کوتانئوس (پدها در حالت پیس) برای زمان ناکافی بودن پاسخ",k:"e",r:"پدها آماده است و capture در ۶۰/min تأیید شد."},
{t:"انفوزیون دوپامین ۵ تا ۲۰ mcg/kg/min یا اپی‌نفرین ۲ تا ۱۰ mcg/min برای هیپوتانسیون",k:"e",r:"با دوپامین فشار به ۹۴/۶۰ رسید."},
{t:"ادامه مسیر PCI اولیه با مانیتور و تیم همراه",k:"e",r:"بیمار با پدهای متصل به کت‌لب رفت؛ RCA پروگزیمال مسدود بود و استنت‌گذاری شد."},
{t:"وراپامیل یا دیلتیازم IV",k:"f",r:"مسدودکننده‌های کانال کلسیم هدایت AV را بیشتر مهار کردند؛ آسیستول رخ داد."},
{t:"شوک غیرسنکرون برای ریتم آهسته",k:"f",r:"شوک بی‌مورد روی ریتم آهسته باعث R-on-T و VF شد."},
{t:"فقط مشاهده تا بهبود خودبه‌خودی بلوک",k:"w",m:15,r:"فشار مدام افت کرد و ۱۵ دقیقه ارزشمند از دست رفت."},
{t:"گذاشتن پیس‌میکر موقت ترانس‌ونوس در اورژانس به‌جای پیس ترانس‌کوتانئوس",k:"w",m:20,r:"گذاشتن لید ترانس‌ونوس زمان‌بر است و در این مرحله لازم نبود."}
],
why:"بلوک AV در MI تحتانی معمولاً گذرا است و به آتروپین، پیس و حمایت اینوتروپ پاسخ می‌دهد. پیس ترانس‌کوتانئوس را از پیش آماده نگه دار. مسدودکننده‌های AV ممنوع‌اند. درمان قطعی بازگشایی RCA است."}
],
end:"RCA پروگزیمال با آنژیوپلاستی باز و استنت‌گذاری شد. بلوک AV ظرف ۴۸ ساعت بهبود یافت و بیمار با EF حفظ‌شده به CCU رفت.",
pearls:["STEMI تحتانی + افت فشار + ریه پاک + JVP بالا: V4R را بگیر.","درگیری RV وابسته به پیش‌بار است: مایع بله؛ نیترات، مرفین، دیورتیک و بتابلاکر خیر.","هدف تماس اول تا دستگاه (FMC-to-device) برای PCI اولیه ≤۹۰ دقیقه است.","اکسیژن فقط وقتی SpO₂ کمتر از ۹۰٪ باشد.","بلوک AV در MI تحتانی: آتروپین، پیس و اینوتروپ؛ درمان قطعی ریپرفیوژن."]
});

CASES.push({
id:"acs2",topic:"سندرم حاد کرونری (ACS)",title:"STEMI قدامی در بیمارستان بدون کت‌لب",brief:"مرد ۶۴ ساله، درد ۹۰ دقیقه‌ای، مرکز PCI سه ساعت دورتر",
intro:"مرد ۶۴ ساله (۸۲ کیلوگرم) با فشارخون بالا، ۹۰ دقیقه پیش دچار درد فشارنده قفسه‌سینه با انتشار به بازوی چپ شده و به اورژانس یک بیمارستان شهرستانی بدون کت‌لب رسیده است. نزدیک‌ترین مرکز PCI حدود ۳ ساعت راه است.",
stages:[
{h:"تشخیص و انتخاب راهبرد بازگشایی",v:"HR 88|BP 168/96|RR 18|SpO2 97%|T 36.8",narr:"بیمار درد دارد و ریه‌ها پاک است. پدهای دفیبریلاتور در دسترس است.",q:"چه اقداماتی انجام می‌دهی؟",
o:[
{t:"ECG ۱۲ لیدی فوری",k:"e",r:"ST بالارفته در V1 تا V5، I و aVL: STEMI قدامی وسیع."},
{t:"مانیتور، رگ‌گیری و اتصال پدهای دفیبریلاتور",k:"e",r:"ریتم سینوسی؛ دسترسی وریدی و پدها آماده شد."},

why:"تاکی‌کاردی نامنظم با QRS پهن و متغیر یعنی AF پره‌اکسایتد. هرگز آدنوزین یا مسدودکننده‌های AV نده؛ می‌توانند VF ایجاد کنند."},
{h:"کنترل ریتم",v:"HR 220|BP 104/66|RR 22|SpO2 98%",narr:"AF پره‌اکسایتد پایدار نسبی است.",q:"درمان را مشخص کن.",
o:[
{t:"پروکائین‌آمید IV (۲۰ تا ۵۰ mg/min، حداکثر ۱۷ mg/kg) با پایش فشار و QRS",k:"e",or:"c",r:"دارو شروع شد؛ فشار و QRS پایش می‌شود."},
{t:"کاردیوورژن الکتریکی سنکرون با آرام‌بخشی (۱۲۰ تا ۲۰۰ J)",k:"e",or:"c",r:"کاردیوورژن موفق بود."},
{t:"آماده نگه داشتن دفیبریلاتور و پدها برای VF",k:"e",r:"پدها متصل است."},
{t:"اصلاح K و Mg",k:"n",r:"طبیعی بود."},
{t:"دیگوکسین IV",k:"f",r:"دیگوکسین هدایت گذرگاه فرعی را تسهیل می‌کند و VF رخ داد."},
{t:"انتظار ۱ ساعت برای رسیدن الکتروفیزیولوژیست",k:"w",m:30,r:"زمان طلایی از دست رفت."},
{t:"وراپامیل خوراکی",k:"w",m:12,r:"ممنوع است؛ خوشبختانه تجویز نشد."}
],
why:"درمان AF پره‌اکسایتد: پروکائین‌آمید یا کاردیوورژن الکتریکی. داروهای مهارکننده AV ممنوع‌اند."},
{h:"افت فشار و بی‌ثباتی",v:"HR 224|BP 68/30|RR 26|SpO2 93%|GCS 12",narr:"هنگام انفوزیون پروکائین‌آمید، بیمار گیج می‌شود و فشار افت می‌کند؛ هنوز AF سریع با QRS پهن.",q:"چه می‌کنی؟",
o:[
{t:"قطع پروکائین‌آمید و کاردیوورژن سنکرون فوری با آرام‌بخشی",k:"e",r:"با ۱۲۰ J ریتم سینوسی شد؛ دلتا ویو دیده می‌شود."},
{t:"آماده بودن دفیبریلاتور برای دفیبریلاسیون ناهم‌زمان در صورت VF",k:"e",r:"آماده بود."},
{t:"ادامه پروکائین‌آمید تا اثر کامل",k:"f",r:"QRS پهن‌تر شد و VF رخ داد."},
{t:"بتابلاکر IV برای کاهش ضربان",k:"f",r:"بتابلاکر هدایت را تغییر داد و باعث VF شد."},
{t:"مایع بولوس ۲ لیتر برای فشار",k:"w",m:12,r:"مشکل اصلی ریتم است؛ مایع به‌تنهایی کمک نمی‌کند."}
],
why:"در ناپایداری همودینامیک (افت فشار، تغییر هوشیاری) کاردیوورژن سنکرون فوری لازم است. اگر VF شد، دفیبریلاسیون ناهم‌زمان."},
{h:"پس از کنترل ریتم",v:"HR 82|BP 116/70|RR 16|SpO2 99%",narr:"ریتم سینوسی با دلتا ویو و PR کوتاه.",q:"قدم بعدی چیست؟",
o:[
{t:"مشاوره الکتروفیزیولوژی برای ablation گذرگاه فرعی",k:"e",r:"EP ablation را برنامه‌ریزی کرد."},
{t:"بستری یا مشاهده و پرهیز از مسدودکننده‌های AV",k:"e",r:"بیمار با مانیتور مشاهده شد."},
{t:"ترخیص با وراپامیل خوراکی",k:"w",m:15,r:"مسدودکننده AV در WPW با AF خطرناک است."},
{t:"ترخیص فوری بدون پیگیری",k:"w",m:10,r:"خطر عود و ایست قلبی؛ باید پیگیری EP داشته باشد."}
],
why:"درمان قطعی WPW با AF، ablation گذرگاه فرعی است. تا آن زمان از مسدودکننده‌های AV پرهیز کن."}
],
end:"بیمار پس از کاردیوورژن پایدار شد و برای ablation گذرگاه فرعی ارجاع شد.",
pearls:["AF پره‌اکسایتد: QRS پهن، نامنظم و بسیار سریع.","هرگز آدنوزین، وراپامیل، دیلتیازم، بتابلاکر یا دیگوکسین نده.","درمان: پروکائین‌آمید یا کاردیوورژن سنکرون.","ناپایدار = کاردیوورژن سنکرون فوری؛ VF = دفیبریلاسیون.","درمان قطعی: ablation."]
});



const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>esc(s).replace(/\n/g,'<br>');
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const COST={e:3,n:3,w:12,f:0};
const KIND={e:['ضروری','ok'],n:['قابل‌قبول','neu'],w:['کم‌ارزش یا اتلاف وقت','warn'],f:['خطرناک','bad']};
const cost=o=>o.m!=null?o.m:COST[o.k];
function reqs(st){const r=[],g={};st.o.forEach((o,i)=>{if(o.k!=='e')return;if(o.or){(g[o.or]=g[o.or]||[]).push(i);}else r.push([i]);});Object.keys(g).forEach(k=>r.push(g[k]));return r;}
const missing=(st,L)=>reqs(st).filter(a=>!a.some(i=>L.has(i))).length;
function limitOf(c){let t=0;c.stages.forEach(st=>reqs(st).forEach(a=>{t+=cost(st.o[a[0]]);}));return Math.round(t*2+15);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const RES={};
let S=null;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2400);}
function render(){$('#app').innerHTML=S?caseView():homeView();}
function home(){S=null;render();window.scrollTo(0,0);}
function start(i){S={i:i,si:0,elapsed:0,hearts:3,wasted:0,incomplete:0,hist:[],st:null,dead:null,done:null,lim:limitOf(CASES[i])};openStage();}
function openStage(){const st=CASES[S.i].stages[S.si];S.st={order:shuffle(st.o.map((_,k)=>k)),locked:new Set(),sel:new Set(),log:[],complete:false,msg:''};render();window.scrollTo(0,0);}
function tog(k,v){if(v)S.st.sel.add(k);else S.st.sel.delete(k);}

function submit(){
  const c=CASES[S.i],st=c.stages[S.si],X=S.st;
  const np=[...X.sel].filter(k=>!X.locked.has(k));
  if(!np.length){toast('حداقل یک اقدام جدید انتخاب کن.');return;}
  np.forEach(k=>{X.locked.add(k);X.log.push(k);S.elapsed+=cost(st.o[k]);});
  X.sel.clear();
  const fat=np.map(k=>st.o[k]).find(o=>o.k==='f');
  if(fat){return die('اقدام خطرناک',fat.t,fat.r);}
  const miss=missing(st,X.locked);
  if(miss===0){X.complete=true;S.wasted+=[...X.locked].filter(k=>st.o[k].k==='w').length;X.msg='';}
  else{S.hearts--;S.incomplete++;X.msg='هنوز '+fa(miss)+' اقدام ضروری انجام نشده و وضعیت بیمار بدتر شد. با توجه به یافته‌ها اقدام‌های باقی‌مانده را انتخاب کن.';}
  if(S.elapsed>S.lim){return die('زمان طلایی تمام شد',null,c.late||'اقدامات بیش از حد طول کشید و زمان طلایی از دست رفت. بیمار دچار ایست قلبی-تنفسی شد و احیا موفق نبود.');}
  if(!X.complete&&S.hearts<=0){return die('تأخیر در اقدامات ضروری',null,'با وجود چند فرصت، اقدامات حیاتی انجام نشد و وضعیت بیمار به‌سرعت بدتر شد تا ایست کامل رخ داد.');}
  render();
  const el=document.getElementById('res');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
}
function snap(){const X=S.st;S.hist.push({si:S.si,locked:new Set(X.locked),log:X.log.slice()});}
function die(title,opt,r){snap();S.dead={title:title,opt:opt,r:r};RES[CASES[S.i].id]={ok:false};render();window.scrollTo(0,0);}
function next(){
  const c=CASES[S.i];snap();
  if(S.si+1<c.stages.length){S.si++;openStage();return;}
  const score=Math.max(0,100-15*S.incomplete-5*S.wasted);
  S.done={score:score};RES[c.id]={ok:true,score:score};render();window.scrollTo(0,0);
}

function monitor(v){
  if(!v)return '';
  return '<div class="mon">'+v.split('|').map(x=>{x=x.trim();const p=x.indexOf(' ');const l=p<0?x:x.slice(0,p);const val=p<0?x:x.slice(p+1);const key=l.replace(/[^A-Za-z0-9]/g,'');
    return '<div class="chip c-'+key+'"><small>'+esc(l)+'</small><b dir="ltr">'+esc(val)+'</b></div>';}).join('')+'</div>';
}
function resCard(o,reveal){
  const cl=reveal?KIND[o.k][1]:'';
  return '<div class="res '+cl+'"><div class="rt">'+esc(o.t)+(reveal?' — '+KIND[o.k][0]:'')+'</div><div>'+fmt(o.r)+'</div></div>';
}
function debrief(){
  const c=CASES[S.i];
  return S.hist.map(h=>{
    const st=c.stages[h.si];
    const rows=reqs(st).map(a=>{const ok=a.some(i=>h.locked.has(i));return '<li class="'+(ok?'ok':'miss')+'"><span>'+(ok?'✓':'✗')+'</span><div>'+esc(a.map(i=>st.o[i].t).join(' — یا — '))+'</div></li>';}).join('');
    const bad=[...h.locked].filter(i=>st.o[i].k==='w'||st.o[i].k==='f').map(i=>{const f=st.o[i].k==='f';return '<li class="'+(f?'miss':'warn')+'"><span>'+(f?'⚠':'△')+'</span><div>'+esc(st.o[i].t)+'</div></li>';}).join('');
    return '<div class="deb"><h4>'+esc(st.h)+'</h4><ul>'+rows+bad+'</ul><p>'+fmt(st.why)+'</p></div>';
  }).join('');
}
function pearls(c){return '<h3>نکات کلیدی</h3><ul class="pearls">'+c.pearls.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>';}
function logAll(){
  const c=CASES[S.i];
  return '<details><summary>مرور گزارش‌ها و نتایج درخواست‌شده</summary>'+S.hist.map(h=>{const st=c.stages[h.si];return '<div class="sec">'+esc(st.h)+'</div>'+h.log.map(k=>resCard(st.o[k],true)).join('');}).join('')+'</details>';
}

function homeView(){
  const topics=[];
  CASES.forEach((c,i)=>{let t=topics.find(x=>x.n===c.topic);if(!t){t={n:c.topic,l:[]};topics.push(t);}t.l.push([c,i]);});
  const ok=Object.keys(RES).filter(k=>RES[k].ok).length;
  let h='<header class="hero grid"><div class="wrap"><h1>شبیه‌ساز کیس‌های اورژانس</h1><p>هر کیس چند مرحله دارد. در هر مرحله چند اقدام انتخاب می‌کنی و نتیجه همان اقدام‌ها (ECG، گزارش تصویربرداری، پاسخ به دارو) را می‌بینی. رویکرد کیس‌ها بر پایه گایدلاین‌های AHA/ACC/ESC و منابع طب اورژانس است.</p>';
  h+='<ul class="rules"><li><i style="background:var(--ok)"></i><span>اقدام ضروری جامانده، پایداری بیمار را کم می‌کند (۳ فرصت).</span></li><li><i style="background:var(--bad)"></i><span>اقدام خطرناک یعنی از دست رفتن بیمار.</span></li><li><i style="background:var(--warn)"></i><span>هر اقدام وقت مصرف می‌کند. اگر از «زمان طلایی» کیس بگذری، بیمار را از دست می‌دهی؛ پس همه گزینه‌ها را یکجا انتخاب نکن.</span></li></ul></div></header><div class="wrap">';
  h+='<p class="sec">'+fa(ok)+' از '+fa(CASES.length)+' کیس با موفقیت تمام شد.</p>';
  topics.forEach(t=>{
    h+='<h2 class="topic">'+esc(t.n)+'</h2><div class="cards">';
    t.l.forEach(p=>{const c=p[0],i=p[1],r=RES[c.id];
      h+='<button class="cc" onclick="start('+i+')"><b>'+esc(c.title)+'</b><span>'+esc(c.brief)+'</span>'+(r?(r.ok?'<br><span class="tag ok">نمره '+fa(r.score)+'</span>':'<br><span class="tag bad">بیمار از دست رفت</span>'):'')+'</button>';});
    h+='</div>';
  });
  return h+'<div class="foot"></div></div>';
}

function caseView(){
  const c=CASES[S.i],st=c.stages[S.si],X=S.st;
  const pct=Math.min(100,Math.round(S.elapsed/S.lim*100));
  const cls=pct>90?'bad':pct>70?'warn':'';
  const over=!!(S.dead||S.done);
  let h='<div class="top"><div class="wrap topin"><button class="ghost" onclick="home()">فهرست</button><div class="ttl">'+esc(c.title)+'</div><div class="hearts" title="پایداری بیمار" aria-label="پایداری بیمار">'+[0,1,2].map(k=>'<i class="'+(k<S.hearts?'on':'')+'"></i>').join('')+'</div></div></div><div class="wrap">';
  if(S.dead){
    const d=S.dead;
    h+='<section class="end bad"><h2>بیمار از دست رفت</h2><p><b>'+esc(d.title)+'</b>'+(d.opt?': '+esc(d.opt):'')+'</p><p>'+fmt(d.r)+'</p></section>';
    h+='<h3>مرور تصمیم‌ها</h3>'+debrief()+pearls(c)+logAll();
    h+='<div class="act"><button class="btn" onclick="start('+S.i+')">تلاش دوباره</button><button class="btn alt" onclick="home()">فهرست کیس‌ها</button></div><div class="foot"></div></div>';
    return h;
  }
  if(S.done){
    const sc=S.done.score;
    h+='<section class="end ok"><h2>بیمار نجات یافت</h2><div class="score">'+fa(sc)+' از ۱۰۰</div><p>'+fmt(c.end)+'</p><p style="color:var(--mut)">زمان مصرف‌شده: '+fa(S.elapsed)+' از '+fa(S.lim)+' دقیقه. '+(S.incomplete?fa(S.incomplete)+' بار اقدام ضروری جا افتاد. ':'')+(S.wasted?fa(S.wasted)+' اقدام کم‌ارزش انجام شد.':'')+'</p></section>';
    h+='<h3>مرور تصمیم‌ها</h3>'+debrief()+pearls(c)+logAll();
    h+='<div class="act"><button class="btn" onclick="start('+S.i+')">تلاش دوباره</button><button class="btn alt" onclick="home()">فهرست کیس‌ها</button></div><div class="foot"></div></div>';
    return h;
  }
  h+='<div class="pt"><small>'+fa(S.si+1)+' از '+fa(c.stages.length)+' مرحله</small><br>'+fmt(c.intro)+'</div>';
  h+=monitor(st.v);
  h+='<div class="clock"><span>زمان طلایی</span><b>'+fa(S.elapsed)+' از '+fa(S.lim)+' دقیقه</b></div><div class="bar '+cls+'"><i style="width:'+pct+'%"></i></div>';
  if(S.hist.length){
    h+='<details><summary>پرونده بیمار: یافته‌های مراحل قبل</summary>'+S.hist.map(x=>{const s2=c.stages[x.si];return '<div class="sec">'+esc(s2.h)+'</div>'+x.log.map(k=>resCard(s2.o[k],false)).join('');}).join('')+'</details>';
  }
  h+='<h2 class="stg">'+esc(st.h)+'</h2><p class="narr">'+fmt(st.narr)+'</p><div class="q">'+esc(st.q)+'</div><div class="opts">';
  X.order.forEach(k=>{
    const o=st.o[k],lk=X.locked.has(k),rv=X.complete&&lk;
    h+='<label class="opt'+(lk?' lk':'')+(rv?' '+KIND[o.k][1]:'')+'"><input type="checkbox" '+((lk||X.sel.has(k))?'checked ':'')+((lk||X.complete)?'disabled ':'')+'onchange="tog('+k+',this.checked)"><span>'+esc(o.t)+'</span>'+(rv?'<em>'+KIND[o.k][0]+'</em>':'')+'</label>';
  });
  h+='</div>';
  if(X.msg)h+='<div class="note" role="alert">'+esc(X.msg)+'</div>';
  h+='<div class="act">';
  if(X.complete){h+='<button class="btn" onclick="next()">'+(S.si+1<c.stages.length?'مرحله بعد':'پایان کیس و نتیجه')+'</button>';}
  else{h+='<button class="btn" onclick="submit()">اجرای اقدام‌های انتخاب‌شده</button>';}
  h+='</div>';
  if(X.log.length){
    h+='<div id="res"><div class="sec">نتیجه اقدام‌ها</div>'+X.log.map(k=>resCard(st.o[k],X.complete)).join('')+'</div>';
    if(X.complete)h+='<div class="deb"><h4>چرا؟</h4><p>'+fmt(st.why)+'</p></div>';
  }
  return h+'<div class="foot"></div></div>';
}
render();
</script>
</body>
