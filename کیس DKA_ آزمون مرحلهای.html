<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>کیس DKA: دختر ۱۶ ساله با درد شکم و استفراغ</title><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{--bg:#f6f7fb;--c:#fff;--tx:#1b2330;--mu:#5b6676;--ac:#1f6feb;--ok:#e3f6e8;--okb:#2e9d57;--bad:#fde8e8;--badb:#d64545;--ms:#fff4d6;--msb:#d9a21b;--bd:#dde2ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141b;--c:#1a212c;--tx:#e8edf5;--mu:#9aa6b8;--ac:#5aa2ff;--ok:#16301f;--okb:#3fb96c;--bad:#3a1b1b;--badb:#ef6b6b;--ms:#3a3012;--msb:#e0b13a;--bd:#2c3646}}
:root[data-theme="dark"]{--bg:#10141b;--c:#1a212c;--tx:#e8edf5;--mu:#9aa6b8;--ac:#5aa2ff;--ok:#16301f;--okb:#3fb96c;--bad:#3a1b1b;--badb:#ef6b6b;--ms:#3a3012;--msb:#e0b13a;--bd:#2c3646}
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.9 Tahoma,"Geeza Pro","Segoe UI",Arial,sans-serif;direction:rtl}
.w{max-width:680px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 10px}h2{font-size:17px;margin:0 0 8px;color:var(--ac)}
.card{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
i{font-style:normal;direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:600}
.info{background:var(--bg);border-radius:10px;padding:10px;margin:0 0 10px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
.opt{display:block;width:100%;text-align:right;background:var(--c);border:2px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0;line-height:1.8}
.opt.on{border-color:var(--ac)}
.opt.ok{background:var(--ok);border-color:var(--okb)}.opt.bad{background:var(--bad);border-color:var(--badb)}.opt.miss{background:var(--ms);border-color:var(--msb)}.opt.dim{opacity:.75}
.why{display:block;font-size:14px;color:var(--mu);margin-top:4px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:11px 18px;margin-top:8px;font-weight:700}
.tip{background:var(--ms);border-right:4px solid var(--msb);border-radius:8px;padding:10px;margin-top:10px}
.sc{font-size:18px;font-weight:700}small{color:var(--mu);display:block;margin-top:10px}
li{margin:6px 0}</style></head><body><div class="w"><h1>کیس DKA: دختر ۱۶ ساله با درد شکم و استفراغ</h1><div class="card"><p>دختر ۱۶ ساله‌ی لاغر با ۳ روز تهوع، استفراغ و درد شکم به اورژانس آمده است. نشانه‌های دهیدراتاسیون دارد و طی چند ساعت اخیر حالش لحظه‌به‌لحظه بدتر شده. در هر مرحله چند اقدام را انتخاب کن؛ بعد از ثبت، بازخورد و اطلاعات تازه اضافه می‌شود.</p><button class="btn" id="start">شروع کیس ◀</button></div><div id="app"></div></div><script>var D={"s": [{"t": "مرحله ۱: تریاژ و اقدامات اولیه", "i": "ظاهر: خواب‌آلود ولی قابل بیدار شدن، لب و مخاط خشک، تنفس عمیق و تند.<br>علائم حیاتی: <i>HR 128</i> ، <i>BP 92/54</i> ، <i>RR 28</i> (عمیق) ، <i>T 37.2</i> ، <i>SpO₂ 98%</i> ، وزن <i>42 kg</i>", "q": "همین الان کدام اقدامات را انجام می‌دهی؟", "o": [["ارزیابی ABC، مانیتور قلبی و پالس‌اکسیمتری", 1, "بیمار ناپایدار است (تاکی‌کاردی، فشار پایین، تنفس کوسمال)؛ ثبات او اولویت دارد."], ["دو رگ محیطی و خون‌گیری (گلوکز، الکترولیت، VBG، کتون، BUN/Cr، CBC)", 1, "پایه‌ی تشخیص و آغاز مایع‌درمانی."], ["قند خون مویرگی فوری (و کتون خون یا ادرار)", 1, "در هر نوجوان با استفراغ، دهیدراتاسیون و تنفس عمیق، قند را چک کن؛ جواب در چند ثانیه می‌آید."], ["تست بارداری", 1, "در سن باروری با درد شکم و استفراغ ضروری است."], ["اندانسترون و ترخیص با تشخیص گاستروانتریت", 0, "دام تشخیصی: برچسب «گاستروانتریت» پیش از چک قند و اسیدوز."], ["CT شکم با کنتراست قبل از هر اقدام دیگر", 0, "بیمار ناپایدار و دهیدره است و علت درد احتمالاً متابولیک است؛ تأخیر و خطر کنتراست."]], "tip": "الگوی کلاسیک: نوجوان لاغر + استفراغ + درد شکم + دهیدراتاسیون + تنفس عمیق و تند (کوسمال) ⟵ اول قند و کتون را چک کن. درد شکم در DKA شایع است (به‌ویژه در کودکان و نوجوانان) و معمولاً با درمان برطرف می‌شود."}, {"t": "مرحله ۲: نتایج آزمایش", "i": "قند خون <i>520 mg/dL</i><br>VBG: <i>pH 7.08</i> ، <i>HCO₃ 6</i> ، <i>pCO₂ 18</i><br>الکترولیت: <i>Na 128</i> ، <i>K 5.6</i> ، <i>Cl 94</i> ، <i>BUN 32</i> ، <i>Cr 1.3</i><br>کتون سرم و ادرار مثبت قوی ، <i>WBC 17,000</i> ، لیپاز کمی بالا ، βhCG منفی<br>ECG: سینوس تاکی‌کارد، بدون T بلند", "q": "کدام تفسیرها درست است؟", "o": [["DKA: گلوکز بالا + کتونمی + اسیدوز (pH زیر 7.3 و HCO₃ زیر 15)؛ شدت شدید است (طبق ISPAD، pH زیر 7.1)", 1, "معیارهای تشخیصی DKA برقرار است."], ["آنیون گپ = <i>28</i> یعنی اسیدوز متابولیک با گپ بالا", 1, "128 − (94 + 6) = 28"], ["Na اصلاح‌شده حدود <i>135</i> است؛ هیپوناترمی ناشی از قند بالاست", 1, "به‌ازای هر 100 mg/dL قند بالای 100، حدود 1.6 به Na اضافه کن: 128 + 6.7."], ["K برابر 5.6 یعنی ذخیره‌ی پتاسیم بدن طبیعی یا بالاست", 0, "اشتباه: کمبود انسولین و اسیدوز K را از سلول خارج می‌کنند؛ ذخیره‌ی کل بدن (به‌خاطر دیورز اسموتیک) کم است و با درمان K سرم افت می‌کند."], ["لکوسیتوز و لیپاز بالا یعنی حتماً پانکراتیت یا آپاندیسیت", 0, "لکوسیتوز استرسی (تا 15 تا 20 هزار) و افزایش غیراختصاصی لیپاز و آمیلاز در DKA شایع است. اگر درد بعد از رفع اسیدوز ماند، دنبال علت جراحی برو."]], "tip": "تشخیص DKA: گلوکز بالا (معمولاً بیش از 250؛ با مهارکننده‌های SGLT2 ممکن است نرمال باشد: DKA یوگلایسمیک) + کتونمی (β-هیدروکسی‌بوتیرات) + اسیدوز با گپ بالا. تست نیتروپروساید فقط استواستات را می‌سنجد و شدت را کمتر نشان می‌دهد."}, {"t": "مرحله ۳: مایع‌درمانی", "i": "هنوز ناپایدار: <i>HR 124</i> ، <i>BP 90/52</i>. ادرار نکرده است. کمبود مایع تخمینی حدود ۸ تا ۱۰٪ وزن بدن.", "q": "اولین گام درمان چیست؟", "o": [["سالین 0.9٪ ، 10 تا 20 mL/kg طی ساعت اول (حدود 420 تا 840 mL)", 1, "اولین و مهم‌ترین گام؛ حجم و پرفیوژن کلیه را برمی‌گرداند و خودِ مایع هم قند و کتون را پایین می‌آورد."], ["سپس جایگزینی کمبود مایع طی 24 تا 48 ساعت با سالین 0.45 تا 0.9٪ و ثبت ورودی و خروجی", 1, "در نوجوان جایگزینی تدریجی‌تر از بزرگسال (1 تا 1.5 L/h) است تا خطر ادم مغزی کم شود (ISPAD)."], ["پایش مکرر هوشیاری (سردرد، تغییر رفتار، برادی‌کاردی)", 1, "علائم هشدار ادم مغزی که باید فوراً شناسایی شود."], ["بولوس سریع چند لیتر سالین", 0, "خطر ادم مغزی؛ افت سریع اسمولالیته مضر است."], ["شروع با دکستروز 5٪ در آب چون بیمار غذا نمی‌خورد", 0, "قند بالاست؛ دکستروز فقط وقتی گلوکز به حدود 200 تا 250 رسید اضافه می‌شود."], ["بی‌کربنات سدیم وریدی فوری برای pH = 7.08", 0, "بی‌کربنات روتین فایده ندارد و می‌تواند هیپوکالمی بدهد؛ فقط برای pH زیر 6.9 تا 7.0 با ناپایداری مطرح است."]], "tip": "طبق Harrison اولین اقدام در DKA مایع ایزوتونیک است و بعد از آن انسولین. دوز بزرگسالان را بی‌فکر به نوجوان کوچک‌جثه نده."}, {"t": "مرحله ۴: انسولین و پتاسیم", "i": "پس از ساعت اول: <i>HR 110</i> ، <i>BP 100/60</i> ، ادرار شروع شده. آزمایش مجدد: <i>K 4.9</i> ، قند <i>470</i> ، <i>pH 7.10</i>", "q": "کدام اقدامات درست است؟", "o": [["انسولین رگولار وریدی (انفوزیون) 0.05 تا 0.1 U/kg/h ، حدود 2 تا 4 U/h", 1, "K بالای 3.3 است و انسولین کتوژنز را مهار می‌کند. در Harrison (بزرگسال) دوز 0.1 U/kg/h است؛ در کودکان و نوجوانان معمولاً بدون بولوس."], ["افزودن KCl به مایع (حدود 20 تا 30 mEq/L) چون K زیر 5.3 و ادرار برقرار است", 1, "هدف K سرم 4 تا 5 است؛ انسولین K را به داخل سلول می‌برد و افت ناگهانی خطرناک است."], ["اگر K زیر 3.3 بود: انسولین را نگه دار و اول K بده", 1, "انسولین در هیپوکالمی شدید آریتمی کشنده می‌دهد."], ["پایش قند ساعتی و الکترولیت/VBG هر 2 تا 4 ساعت", 1, "هدف افت قند 50 تا 75 mg/dL در ساعت است؛ اگر کمتر بود، دوز انسولین را بالا ببر."], ["فقط NPH زیرجلدی", 0, "در DKA جذب زیرجلدی نامطمئن است؛ انفوزیون وریدی قابل تنظیم لازم است."], ["پتاسیم نمی‌دهیم چون K اولیه 5.6 بود", 0, "با انسولین و اصلاح اسیدوز، K سرم به‌سرعت افت می‌کند."]], "tip": "قبل از انسولین حتماً K را بدان. K زیر 3.3 ⟵ اول K. K بالای 5.3 ⟵ K نده و هر 2 ساعت چک کن. فسفات فقط در مقدار بسیار پایین (زیر 1 mg/dL) یا اختلال قلبی جایگزین می‌شود."}, {"t": "مرحله ۵: چند ساعت بعد", "i": "<i>قند 210</i> ، <i>pH 7.20</i> ، <i>HCO₃ 12</i> ، آنیون گپ <i>18</i>. تهوع کمتر شده، درد شکم کمی مانده، ادرار خوب است. بیمار می‌گوید حدود دو ماه است تشنگی، پرادراری و کاهش وزن داشته.", "q": "قند به حدود 200 رسیده؛ چه می‌کنی؟", "o": [["انسولین وریدی را ادامه بده و به مایع دکستروز اضافه کن (D5 + سالین 0.45 تا 0.9٪)", 1, "اسیدوز و کتوز هنوز برطرف نشده؛ انسولین ادامه می‌یابد و دکستروز جلوی هیپوگلیسمی را می‌گیرد."], ["انسولین را قطع کن چون قند تقریباً نرمال شد", 0, "قند زودتر از کتوز اصلاح می‌شود؛ معیار قطع، رفع اسیدوز است نه قند."], ["درد شکم را پیگیری کن؛ اگر بعد از رفع اسیدوز ماند، دنبال علت جراحی یا پانکراتیت برو", 1, "درد شکم متابولیک معمولاً با درمان بهتر می‌شود."], ["دنبال عامل زمینه‌ساز بگرد: HbA1c ، آنالیز و کشت ادرار ، CXR ، ECG", 1, "عفونت، حذف انسولین، شروع دیابت و (در سن بالاتر) انفارکتوس از عوامل شایع‌اند."]], "tip": "معیار رفع DKA در Harrison: HCO₃ حداقل 18 ، pH بالای 7.3 و بسته شدن آنیون گپ. گلوکز اولین چیزی است که نرمال می‌شود، نه آخرین."}, {"t": "مرحله ۶: رفع DKA و انتقال به انسولین زیرجلدی", "i": "حدود ۱۸ ساعت بعد: <i>pH 7.34</i> ، <i>HCO₃ 20</i> ، <i>AG 11</i> ؛ بیمار می‌خورد، تهوعی ندارد و درد شکم برطرف شده. <i>HbA1c 13%</i>", "q": "اقدامات بعدی؟", "o": [["شروع انسولین زیرجلدی (پایه-بولوس) و ادامه‌ی انفوزیون وریدی 1 تا 2 ساعت هم‌پوشانی", 1, "نیمه‌عمر انسولین وریدی کوتاه است؛ قطع ناگهانی یعنی برگشت کتوز."], ["قطع انسولین وریدی همزمان با اولین تزریق زیرجلدی", 0, "باعث برگشت کتواسیدوز می‌شود."], ["مشاوره‌ی غدد و آموزش بیمار و خانواده (گلوکومتر، شمارش کربوهیدرات، مدیریت روز بیماری)", 1, "آموزش هسته‌ی پیشگیری از عود است."], ["بررسی آنتی‌بادی‌های دیابت نوع ۱ (GAD ، IA-2) و غربالگری بیماری‌های خودایمنی همراه", 1, "برای تأیید نوع دیابت و یافتن بیماری‌هایی مثل تیروئید و سلیاک."], ["ترخیص امروز بدون آموزش چون حال بیمار خوب است", 0, "ترخیص بدون آموزش، انسولین و پیگیری خطر بازگشت DKA را بالا می‌برد."]], "tip": "تشخیص نهایی: DKA (در اینجا به‌عنوان تظاهر اول دیابت). بعد از رفع بحران، درمان واقعی آموزش و برنامه‌ی انسولین است."}], "t": ["الگو: نوجوان لاغر + استفراغ + درد شکم + دهیدراتاسیون + تنفس کوسمال ⟵ قبل از هر برچسبی، قند و کتون را چک کن.", "DKA = هیپرگلیسمی + کتونمی + اسیدوز متابولیک با گپ بالا. آنیون گپ = Na − (Cl + HCO₃).", "ترتیب درمان: ثبات و مایع ⟵ چک K ⟵ انسولین وریدی (همراه K) ⟵ پایش ساعتی ⟵ افزودن دکستروز وقتی قند حدود 200 تا 250 شد ⟵ انتقال به زیرجلدی با هم‌پوشانی.", "K سرم نرمال یا بالا با کمبود ذخیره‌ی کل بدن همراه است؛ بی‌کربنات فقط در pH بسیار پایین (زیر 6.9 تا 7.0)؛ فسفات فقط در کمبود شدید.", "نوجوانان: مایع تدریجی و پایش نورولوژیک برای ادم مغزی؛ دوز بزرگسال را مستقیم کپی نکن.", "عامل زمینه‌ساز را بجوی: حذف انسولین، عفونت، شروع دیابت، انفارکتوس، داروها (مثل SGLT2i).", "درد شکم در DKA معمولاً متابولیک است؛ اگر بعد از رفع اسیدوز ماند، علت جراحی را بررسی کن."]},box=document.getElementById('app'),n=0,got=0,tot=0;
function card(h){var d=document.createElement('div');d.className='card';d.innerHTML=h;box.appendChild(d);return d}
function go(d){setTimeout(function(){window.scrollTo(0,d.getBoundingClientRect().top+window.pageYOffset-10)},50)}
function stage(){
 var s=D.s[n],c=card('<h2>'+s.t+'</h2><div class="info">'+s.i+'</div><b>'+s.q+'</b><div class="ops"></div><button class="btn">ثبت انتخاب‌ها</button>');
 var ob=c.querySelector('.ops'),sub=c.querySelector('.btn'),sel=[],done=false,bs=[];
 s.o.forEach(function(o,k){var b=document.createElement('button');b.className='opt';b.innerHTML=o[0];b.onclick=function(){if(done)return;sel[k]=!sel[k];b.className='opt'+(sel[k]?' on':'')};ob.appendChild(b);bs.push(b)});
 sub.onclick=function(){
  if(done)return;done=true;var pts=0,mx=0;
  s.o.forEach(function(o,k){var b=bs[k],ok=o[1]==1,cl;
   if(ok)mx++;
   if(sel[k]&&ok){cl='ok';pts++}else if(sel[k]){cl='bad';pts--}else if(ok){cl='miss'}else{cl='dim'}
   b.className='opt '+cl;
   b.innerHTML=(sel[k]&&ok?'✔ ':sel[k]?'✘ ':ok?'⚠ (باید انتخاب می‌شد) ':'')+o[0]+'<span class="why">'+o[2]+'</span>'});
  if(pts<0)pts=0;got+=pts;tot+=mx;
  var t=document.createElement('div');t.className='tip';t.innerHTML='<b>نکته‌ی آموزشی:</b> '+s.tip+'<br><b>امتیاز این مرحله: '+pts+' از '+mx+'</b>';
  c.insertBefore(t,sub);
  sub.textContent=n<D.s.length-1?'مرحله‌ی بعد ◀':'مشاهده‌ی نتیجه';
  sub.onclick=function(){sub.style.display='none';n++;if(n<D.s.length)stage();else fin()};
 };go(c)}
function fin(){
 var c=card('<h2>نتیجه‌ی نهایی</h2><div class="sc">'+got+' از '+tot+'</div><h2 style="margin-top:12px">نکات کلیدی</h2><ul>'+D.t.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul><button class="btn">شروع دوباره</button><small>منبع درمان: Harrison's Principles of Internal Medicine (بخش عوارض حاد دیابت: DKA و HHS) ؛ نکات مخصوص نوجوانان از راهنمای ISPAD. خلاصه‌ی بیمار (سن، علائم و تشخیص نهایی) از صحبت شماست؛ اعداد علائم حیاتی و آزمایش‌ها و سیر مراحل را برای آموزش خودم ساخته‌ام و از روی پادکست نیست. این محتوا جایگزین پروتکل بیمارستان و نظر استاد نیست.</small>');
 c.querySelector('.btn').onclick=function(){location.reload()};go(c)}
document.getElementById('start').onclick=function(){this.style.display='none';stage()};</script></body></html>
